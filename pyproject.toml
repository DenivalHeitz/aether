[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "Local self-hosted web search and page fetching MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denival Heitz" }]
dependencies = [
    # Standalone FastMCP framework (MCP SDK 2.x comes along with it).
    "fastmcp>=4,<5",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12,<5",
]

[tool.setuptools]
py-modules = ["server"]
