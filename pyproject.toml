[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether"
version = "0.1.0"
description = "Local self-hosted web search and page fetching MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denival Heitz" }]
dependencies = [
    # FastMCP 1.x is provided by the MCP Python SDK 1.x line.
    "mcp>=1.30,<2",
    "httpx>=0.28,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
dev = [
    "mcp[cli]>=1.30,<2",
]

[tool.setuptools]
py-modules = ["server"]
